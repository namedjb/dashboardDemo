<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="基于 128,975 条销售明细的离线经营全景看板">
  <title>经营全景看板</title>
<style>
:root {
  --bg: #f2f5f0;
  --bg-elevated: #e9ede6;
  --surface: #ffffff;
  --surface-light: #f6f8f3;
  --border: #dde3da;
  --border-light: #eaede7;
  --text: #13233b;
  --text-secondary: #5c6a7b;
  --text-tertiary: #8b96a1;
  --accent: #2267dc;
  --accent-deep: #16489e;
  --accent-soft: rgba(34, 103, 220, 0.09);
  --accent-glow: rgba(34, 103, 220, 0.22);
  --lime: #d9f46f;
  --lime-deep: #a3c12e;
  --green: #2ea873;
  --red: #ff785f;
  --orange: #f2994a;
  --blue: #2267dc;
  --cyan: #22b8cf;
  --violet: #8f6bdd;
  --shadow: 0 1px 2px rgba(19, 35, 59, 0.05), 0 8px 22px rgba(19, 35, 59, 0.06);
}

* { box-sizing: border-box; }

html {
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  font-variant-numeric: tabular-nums;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: #c4cdc0 transparent;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #c4cdc0; border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 94% 4%, rgba(217, 244, 111, 0.16), transparent 26rem),
    linear-gradient(rgba(19, 35, 59, 0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(19, 35, 59, 0.028) 1px, transparent 1px),
    var(--bg);
  background-size: auto, 52px 52px, 52px 52px, auto;
}

button { font: inherit; color: inherit; }

.app-shell {
  min-height: 100vh;
}

/* Main */
.main-content {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 60px;
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.page-title { font-size: 16px; font-weight: 700; }
.page-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary); }

.live-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--green);
  box-shadow: 0 0 0 4px rgba(46, 168, 115, 0.15);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

.dashboard-body {
  padding: 24px 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
}

/* Period tabs */
.period-tabs {
  display: flex;
  gap: 8px;
  align-self: flex-start;
  background: var(--surface);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.period-tabs button {
  border: 0;
  background: transparent;
  padding: 7px 14px;
  border-radius: 7px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .15s ease;
}

.period-tabs button:hover { color: var(--text); }
.period-tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* KPI cards */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform .15s ease, border-color .15s ease;
}

.kpi-card:hover { transform: translateY(-2px); border-color: var(--accent-soft); }

.kpi-card .kpi-label { font-size: 13px; color: var(--text-secondary); }
.kpi-card .kpi-value { font-size: 32px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.kpi-card .kpi-caption { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* Unit label (bottom-right of each module) */
.panel-unit {
  margin-top: auto;
  align-self: flex-end;
  font-size: 10px;
  color: var(--text-tertiary);
  letter-spacing: 0.05em;
  white-space: nowrap;
  opacity: .85;
}

/* Panels */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.panel-head h3 { font-size: 14px; font-weight: 600; margin: 0; color: var(--text); }
.panel-head .eyebrow { display: none; }

.chart-legend {
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--text-secondary);
}
.chart-legend button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: inherit;
  white-space: nowrap;
  cursor: pointer;
  transition: opacity .18s ease, background .18s ease;
}
.chart-legend button:hover { background: var(--surface-light); }
.chart-legend button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chart-legend button.inactive { opacity: .38; }
.chart-legend .sw-bar { width: 12px; height: 10px; border-radius: 2px; background: linear-gradient(180deg, #5b8def 0%, var(--accent-deep) 100%); }
.chart-legend .sw-line { width: 14px; height: 3px; border-radius: 2px; background: #ff8c42; }

.section-heading { display: none; }

/* Grid layouts */
.content-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}

.content-grid.three-col {
  grid-template-columns: repeat(3, 1fr);
}

.content-grid.two-col {
  grid-template-columns: repeat(2, 1fr);
}

/* 趋势+状态行：主图更宽；单面板行：铺满整行，不留空白列 */
.content-grid.trend-layout {
  grid-template-columns: 5fr 2fr;
}

.content-grid.single {
  grid-template-columns: 1fr;
}

/* Trend chart — 混合图：订单数柱形（左轴） + 销售额折线（右轴） */
.trend-panel { min-height: 300px; }

.trend-scroll { overflow: hidden; padding-bottom: 6px; }

.trend-chart { position: relative; }

.trend-axis {
  position: absolute;
  top: 14px;
  bottom: 20px;
  font-size: 9px;
  color: var(--text-tertiary);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  pointer-events: none;
}
.trend-axis span { position: absolute; transform: translateY(50%); }
.axis-orders { left: 2px; width: 40px; }
.axis-orders span { left: 0; }
.axis-revenue { right: 2px; width: 42px; text-align: right; }
.axis-revenue span { right: 0; white-space: nowrap; }
.trend-axis, .trend-bars, .trend-line-svg { transition: opacity .2s ease; }
.series-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.trend-grid { position: absolute; left: 44px; right: 46px; top: 14px; bottom: 20px; pointer-events: none; }
.trend-grid i { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(19, 35, 59, 0.09); }

.trend-line-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.trend-area { fill: url(#trendAreaFill); }
.trend-line { fill: none; stroke: #ff8c42; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trend-dot { fill: #fff; stroke: #ff8c42; stroke-width: 1.6; opacity: 0; }
.trend-dot.active { opacity: 1; r: 4.5; stroke-width: 2.6; }

.trend-bars { position: absolute; left: 0; right: 0; top: 14px; bottom: 20px; }
.trend-col {
  position: absolute;
  bottom: 0;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
}
.trend-bar {
  width: 100%;
  border-radius: 3px 3px 0 0;
  background: linear-gradient(180deg, #5b8def 0%, var(--accent-deep) 100%);
  opacity: .48;
  transform-origin: bottom;
  transition: opacity .15s ease, box-shadow .15s ease;
}
.trend-col:hover .trend-bar { opacity: .8; }
.trend-col.active .trend-bar { opacity: 1; box-shadow: 0 0 12px var(--accent-glow); }

.trend-xlabels { position: absolute; left: 0; right: 0; top: 14px; bottom: 20px; pointer-events: none; }
.trend-xlabel {
  position: absolute;
  bottom: -14px;
  transform: translateX(-50%);
  font-size: 9px;
  color: var(--text-tertiary);
  white-space: nowrap;
}

.trend-hover-line { position: absolute; top: 14px; bottom: 20px; width: 1px; background: rgba(19, 35, 59, 0.2); opacity: 0; pointer-events: none; transition: opacity .12s ease; }

.trend-tip {
  position: absolute;
  top: 4px;
  width: 132px;
  padding: 8px 10px;
  background: #13233b;
  color: #fff;
  border-radius: 8px;
  font-size: 11px;
  line-height: 1.5;
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s ease;
  box-shadow: 0 8px 24px rgba(19, 35, 59, 0.28);
  z-index: 6;
}
.trend-tip .tip-date { font-weight: 600; margin-bottom: 3px; }
.trend-tip .tip-row { display: flex; align-items: center; gap: 5px; color: rgba(255, 255, 255, 0.85); }
.trend-tip .tip-row b { margin-left: auto; color: #fff; font-weight: 600; }
.trend-tip .sw-bar { width: 8px; height: 8px; border-radius: 2px; background: #6ca3ff; display: inline-block; }
.trend-tip .sw-line { width: 8px; height: 2px; background: #ff8c42; display: inline-block; }

/* 首次进入播放完整动画；周期切换时仅刷新数据区域 */
@keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes lineDraw { from { stroke-dashoffset: 4200; } to { stroke-dashoffset: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes dataRefresh { from { opacity: .18; } to { opacity: 1; } }

.anim { animation: riseIn .55s cubic-bezier(.22, .68, .32, 1) both; }
.anim .trend-bar { animation: barGrow .6s cubic-bezier(.2, .7, .3, 1) both; }
.anim .trend-line { stroke-dasharray: 4200; animation: lineDraw 1.1s ease-out .2s both; }
.anim .trend-area { animation: fadeIn .6s ease .25s both; }

.data-refresh .kpi-value,
.data-refresh .panel > :not(.panel-head):not(.panel-unit) {
  animation: dataRefresh .38s ease-out both;
}

header.topbar { animation: fadeIn .5s ease both; }

@media (prefers-reduced-motion: reduce) {
  .anim, .anim .trend-bar, .anim .trend-line, .anim .trend-area, .anim .trend-dot, header.topbar,
  .data-refresh .kpi-value, .data-refresh .panel > :not(.panel-head):not(.panel-unit) { animation: none; }
}

/* Status ring */
.status-layout {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  flex: 1;
  flex-wrap: wrap;
}

.donut {
  width: 150px;
  height: 150px;
  display: grid;
  place-items: center;
  position: relative;
}

.donut svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.donut-track { fill: none; stroke: var(--bg-elevated); stroke-width: 24; }
.status-segment {
  fill: none;
  stroke-width: 24;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .18s ease, stroke-width .18s ease;
}
.status-segment.is-active { stroke-width: 30; }
.status-segment.is-dimmed { opacity: .16; }
.status-segment:focus, .status-segment:focus-visible { outline: none; }
.donut-label {
  position: relative;
  z-index: 1;
  width: 82px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
  text-align: center;
  pointer-events: none;
}
.donut-label strong { display: block; color: var(--text); font-size: 14px; }
.donut-label span { display: block; margin-top: 3px; color: var(--text-tertiary); font-size: 10px; font-weight: 500; }

.status-legend {
  display: grid;
  gap: 10px;
}

.status-legend button {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 5px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: opacity .18s ease, background .18s ease;
}
.status-legend button:hover { background: var(--surface-light); }
.status-legend button.is-active { color: var(--text); font-weight: 600; }
.status-legend button.is-dimmed { opacity: .35; }
.status-legend button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* Ranked bars */
.ranked-bars { display: flex; flex-direction: column; gap: 10px; }

.rank-row {
  display: grid;
  grid-template-columns: 26px 1fr;
  align-items: center;
  gap: 10px;
  font-size: 12px;
}

.rank-index { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.rank-label { display: flex; justify-content: space-between; margin-bottom: 5px; color: var(--text-secondary); }
.rank-label strong { color: var(--text); font-weight: 600; }
.rank-main { min-width: 0; }
.bar-track { height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; }
.bar-track span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.ranked-bars.lime .bar-track span { background: var(--lime-deep); }
.ranked-bars.violet .bar-track span { background: var(--violet); }

/* Top 6 分析行：三个面板同步收紧，保持等高且避免空白过多 */
.content-grid.three-col > .panel { gap: 12px; }
.content-grid.three-col .geo-panel .ranked-bars { gap: 8px; }
.content-grid.three-col .geo-panel .rank-label { margin-bottom: 3px; }

/* Mix panel */
.mix-block { display: flex; flex-direction: column; gap: 10px; }
.mix-title { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); }
.mix-title strong { color: var(--text); font-weight: 600; }
.stacked-bar { height: 8px; background: var(--bg-elevated); border-radius: 4px; overflow: hidden; display: flex; }
.stacked-bar span { background: var(--accent); }
.stacked-bar i { flex: 1; background: var(--blue); }
.mix-detail { display: flex; gap: 16px; font-size: 11px; color: var(--text-tertiary); }

.service-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.service-grid > div {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.service-grid span { font-size: 12px; color: var(--text-secondary); }
.service-grid strong { font-size: 18px; color: var(--text); font-weight: 700; }
.service-grid small { font-size: 10px; color: var(--text-tertiary); }

.signal-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.signal-grid > div {
  background: var(--bg-elevated);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}

.signal-grid span { color: var(--text-secondary); }
.signal-grid strong { color: var(--text); font-weight: 700; }

.content-grid.three-col .mix-block { gap: 7px; }
.content-grid.three-col .service-grid { gap: 8px; }
.content-grid.three-col .service-grid > div { padding: 9px 10px; }
.content-grid.three-col .service-grid strong { font-size: 16px; }
.content-grid.three-col .signal-grid { gap: 8px; }
.content-grid.three-col .signal-grid > div { padding: 8px 10px; }

/* Weekday panel */
.weekday-chart {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  flex: 1;
  padding-top: 20px;
}

.weekday-chart > div {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

.weekday-value {
  font-size: 10px;
  color: var(--text-tertiary);
  opacity: 0;
  transition: opacity .15s ease;
}

.weekday-chart > div:hover .weekday-value { opacity: 1; }

.weekday-track { width: 100%; height: 130px; background: var(--bg-elevated); border-radius: 6px; position: relative; }
.weekday-track span {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  border-radius: 6px;
  background: linear-gradient(180deg, #7ea8f2, var(--blue));
  transition: box-shadow .15s ease;
}

.weekday-chart > div:hover .weekday-track span { box-shadow: 0 0 14px var(--accent-glow); }

.weekday-chart strong { font-size: 11px; color: var(--text-secondary); font-weight: 500; }

.content-grid.three-col .weekday-chart { gap: 8px; padding-top: 8px; }
.content-grid.three-col .weekday-chart > div { gap: 6px; }
.content-grid.three-col .weekday-track { height: 96px; }

/* SKU table */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }

.sku-panel .table-wrap {
  max-height: 520px;
  overflow: auto;
}

.sku-panel thead {
  position: sticky;
  top: 0;
  z-index: 2;
}

table { width: 100%; border-collapse: collapse; font-size: 12px; }

thead { background: var(--bg-elevated); }

th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); color: var(--text-secondary); }

th { font-weight: 600; color: var(--text); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }

tbody tr:hover { background: rgba(19, 35, 59, 0.03); }

tbody strong { color: var(--text); font-weight: 500; }

.table-risk { color: var(--red); font-weight: 600; }
.table-success { color: var(--green); font-weight: 600; }

/* 通用数据项交互：悬停聚焦，点击可多选锁定 */
.selectable-item {
  cursor: pointer;
  outline: none;
  transition: opacity .18s ease;
}
.selectable-item.is-muted { opacity: .24; }
.selectable-item:focus, .selectable-item:focus-visible { outline: none; box-shadow: none; }

/* Footer */
footer {
  margin-top: 8px;
  padding: 18px 0;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--text-tertiary);
}

footer strong { color: var(--text-secondary); margin-right: 8px; }

footer details summary { cursor: pointer; list-style: none; }
footer details summary::-webkit-details-marker { display: none; }
footer details div { margin-top: 8px; max-width: 480px; line-height: 1.6; }

/* AI 智能分析 Demo */
.app-shell { display: flex; align-items: flex-start; }
.main-content { flex: 1 1 auto; transition: width .28s ease; }
.dashboard-body { transition: max-width .28s ease, padding .28s ease; }
.app-shell.ai-open .dashboard-body { max-width: 1080px; }

/* 左侧资源栏：默认收回 */
.resource-sidebar {
  position: sticky;
  top: 0;
  z-index: 15;
  flex: 0 0 56px;
  width: 56px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--border);
  background: rgba(255, 255, 255, .94);
  backdrop-filter: blur(12px);
  transition: width .24s ease, flex-basis .24s ease, box-shadow .24s ease;
}
.resource-sidebar.expanded {
  flex-basis: 218px;
  width: 218px;
  box-shadow: 10px 0 26px rgba(19, 35, 59, .07);
}
.resource-sidebar-head {
  height: 60px;
  flex: 0 0 60px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  border-bottom: 1px solid var(--border-light);
}
.resource-toggle,
.resource-item,
.resource-new-btn {
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
}
.resource-toggle {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  font-size: 20px;
  transition: background .15s ease, transform .24s ease;
}
.resource-sidebar.expanded .resource-toggle { transform: rotate(180deg); }
.resource-toggle:hover { background: var(--surface-light); color: var(--text); }
.resource-nav {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 8px;
  overflow-y: auto;
  overflow-x: hidden;
}
.resource-custom-list { display: flex; flex-direction: column; gap: 6px; }
.resource-item,
.resource-new-btn {
  width: 100%;
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 10px;
  border-radius: 9px;
  white-space: nowrap;
  text-align: left;
  transition: background .15s ease, color .15s ease;
}
.resource-item:hover,

<script>
(function () {
  "use strict";

  const DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
  const periodOrder = ["all", "2022-04", "2022-05", "2022-06"];
  const statusColors = {
    "已取消": "#ff785f",
    "退货/退回": "#b998ef",
    "已送达": "#5edaa3",
    "运输中": "#6ca3ff",
    "待处理": "#f2cc69",
  };

  let periodKey = "all";
  let currentDaily = null;
  let animationCleanupTimer = null;
  let refreshCleanupTimer = null;
  let isInitialRender = true;
  const seriesVisibility = { orders: true, revenue: true };
  const AI_COMPONENTS = [
    { id: "kpi-revenue", title: "有效销售额", selector: ".kpi-card:nth-child(1)" },
    { id: "kpi-orders", title: "订单数", selector: ".kpi-card:nth-child(2)" },
    { id: "kpi-units", title: "销售件数", selector: ".kpi-card:nth-child(3)" },
    { id: "kpi-aov", title: "有效客单价", selector: ".kpi-card:nth-child(4)" },
    { id: "daily-trend", title: "日度经营走势", selector: ".trend-panel" },
    { id: "order-status", title: "订单状态", selector: ".status-panel" },
    { id: "categories", title: "品类销售 TOP 8", selector: ".category-panel" },
    { id: "regions", title: "区域销售 TOP 6", selector: ".geo-panel" },
    { id: "fulfilment", title: "履约、时效与客群", selector: ".mix-panel" },
    { id: "weekdays", title: "星期销售分布", selector: ".weekday-panel" },
    { id: "cities", title: "城市销售贡献", selector: ".city-panel" },
    { id: "skus", title: "SKU 经营明细 TOP 100", selector: ".sku-panel" },
  ];
  const AI_MOBIUS_ICON = '<svg class="ai-mobius-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.2 16.2C1.8 13.8 2 10.1 4.7 8.1c2.7-2 5.5-.4 7.3 3.9 1.8 4.3 4.6 5.9 7.3 3.9 2.7-2 2.9-5.7.5-8.1-2.4-2.4-5.8-1.1-7.8 4.2-2 5.3-5.4 6.6-7.8 4.2Z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let aiSidebarOpen = false;
  let currentAIComponentId = "daily-trend";
  const selectedAIComponentIds = new Set(["daily-trend"]);
  let aiReplyTimer = null;
  let aiLayoutTimer = null;
  let aiSending = false;

  // 仅首次进入使用完整的分段入场动画
  const animAttr = (delay) => (delay == null ? "" : ` anim" style="animation-delay:${delay.toFixed(2)}s"`);
  // 坐标轴取整刻度：向上取到 1/2/2.5/5×10ⁿ
  const niceCeil = (value) => {
    if (value <= 0) return 1;
    const exp = Math.floor(Math.log10(value));
    const base = Math.pow(10, exp);
    const m = value / base;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * base;
  };
  // 右轴销售额范围以全部周期的峰值统一计算，切换月份时不再变化
  const FIXED_REVENUE_MAX = niceCeil(Math.max(
    ...DATA.periods.all.daily.map((item) => item.revenue),
    1,
  ));

  const escapeHtml = (value) => String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

  // 演示用固定汇率：1 INR ≈ 0.0705 CNY（2026-08-18 中间价），数据源为 INR，展示统一换算为人民币
  const CNY_PER_INR = 0.0705;
  const money = (value, digits = 1) => `¥${new Intl.NumberFormat("zh-CN", {
    notation: "compact",
    maximumFractionDigits: digits,
  }).format(value * CNY_PER_INR)}`;

  const integer = (value) => new Intl.NumberFormat("zh-CN", {
    maximumFractionDigits: 0,
  }).format(value);

  const percent = (value) => `${Number(value).toFixed(1)}%`;

  function kpiCard({ label, value, unit, anim }) {
    return `<article class="kpi-card${animAttr(anim)}">
      <div class="kpi-label">${escapeHtml(label)}</div>
      <div class="kpi-value">${escapeHtml(value)}</div>
      <div class="panel-unit">单位：${escapeHtml(unit)}</div>
    </article>`;
  }

  function trendChart(daily, anim, maxW) {
    const n = daily.length;
    // 首次生成使用估算宽度；渲染后传入容器实际宽度，让月度图表铺满面板
    const CHART_W = Math.max(320, maxW || Math.min(n * 16, 860));
    const PAD_L = 44, PAD_R = 46, PAD_T = 14, PAD_B = 20;
    const PLOT_H = 150;
    const CHART_H = PAD_T + PLOT_H + PAD_B;
    const plotW = CHART_W - PAD_L - PAD_R;
    const slot = plotW / n;

    const oNice = niceCeil(Math.max(...daily.map((d) => d.orders), 1));
    const rNice = FIXED_REVENUE_MAX;
    const steps = [0, 1, 2, 3, 4];

    // 0 位于底部，最大值位于顶部
    const oTicks = steps.map((t) => ({ v: oNice * t / 4, bottom: PLOT_H * t / 4 }));
    const rTicks = steps.map((t) => ({ v: rNice * t / 4, bottom: PLOT_H * t / 4 }));

    // 销售额折线点（右轴）
    const pts = daily.map((d, i) => [
      PAD_L + slot * i + slot / 2,
      PAD_T + PLOT_H - (d.revenue / rNice) * PLOT_H,
    ]);
    const linePts = pts.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const areaPath = `M${pts[0][0].toFixed(1)},${PAD_T + PLOT_H} L${linePts.replace(/ /g, " L")} L${pts[n - 1][0].toFixed(1)},${PAD_T + PLOT_H} Z`;

    // 订单数柱形（左轴）
    const bars = daily.map((d, i) => {
      const h = Math.max(2, (d.orders / oNice) * PLOT_H);
      const x = PAD_L + slot * i;
      const w = Math.max(3, slot - 3);
      return `<div class="trend-col" data-index="${i}" style="left:${x.toFixed(1)}px;width:${w.toFixed(1)}px">
        <div class="trend-bar" style="height:${h.toFixed(1)}px;animation-delay:${anim == null ? 0 : (i * 0.006).toFixed(3)}s"></div>
      </div>`;
    }).join("");

    // 日期标签
    const labelEvery = n <= 35 ? 5 : 14;
    const labels = daily.map((d, i) => (i % labelEvery !== 0 ? "" :
      `<span class="trend-xlabel" style="left:${(PAD_L + slot * i + slot / 2).toFixed(1)}px">${d.name.slice(5).replace("-", "/")}</span>`
    )).join("");

    // 折线圆点
    const dots = pts.map((p, i) =>
      `<circle class="trend-dot" data-index="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"/>`
    ).join("");

    return `<article class="panel trend-panel${animAttr(anim)}">
      <div class="panel-head">
        <h3>日度经营走势</h3>
        <div class="chart-legend" aria-label="图表数据系列">
          <button type="button" data-series="orders" class="${seriesVisibility.orders ? "" : "inactive"}" aria-pressed="${seriesVisibility.orders}"><i class="sw-bar"></i>订单数</button>
          <button type="button" data-series="revenue" class="${seriesVisibility.revenue ? "" : "inactive"}" aria-pressed="${seriesVisibility.revenue}"><i class="sw-line"></i>销售额</button>
        </div>
      </div>
      <div class="trend-scroll">
        <div class="trend-chart" data-padl="${PAD_L}" data-slot="${slot.toFixed(3)}" data-n="${n}" style="width:${CHART_W}px;height:${CHART_H}px">
          <div class="trend-axis axis-orders${seriesVisibility.orders ? "" : " series-hidden"}">${oTicks.map((t) => `<span style="bottom:${t.bottom.toFixed(1)}px">${integer(Math.round(t.v))}</span>`).join("")}</div>
          <div class="trend-axis axis-revenue${seriesVisibility.revenue ? "" : " series-hidden"}">${rTicks.map((t) => `<span style="bottom:${t.bottom.toFixed(1)}px">${money(t.v, 0)}</span>`).join("")}</div>
          <div class="trend-grid">${steps.map((t) => `<i style="bottom:${(PLOT_H * t / 4).toFixed(1)}px"></i>`).join("")}</div>
          <svg class="trend-line-svg${seriesVisibility.revenue ? "" : " series-hidden"}" viewBox="0 0 ${CHART_W} ${CHART_H}">
            <defs><linearGradient id="trendAreaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff8c42" stop-opacity="0.2"/><stop offset="100%" stop-color="#ff8c42" stop-opacity="0.02"/></linearGradient></defs>
            <path class="trend-area" d="${areaPath}"/>
            <polyline class="trend-line" points="${linePts}"/>
            ${dots}
          </svg>
          <div class="trend-bars${seriesVisibility.orders ? "" : " series-hidden"}">${bars}</div>
          <div class="trend-xlabels">${labels}</div>
          <div class="trend-hover-line"></div>
          <div class="trend-tip"></div>
        </div>
      </div>
      <div class="panel-unit">左轴：单 · 右轴：¥</div>
    </article>`;
  }

  // 混合图联动：悬停时柱形与折线圆点同步高亮，并显示双指标 tooltip
  function bindTrendChart() {
    const chart = document.querySelector(".trend-chart");
    if (!chart || !currentDaily) return;
    const cols = chart.querySelectorAll(".trend-col");
    const dots = chart.querySelectorAll(".trend-dot");
    const tip = chart.querySelector(".trend-tip");
    const hline = chart.querySelector(".trend-hover-line");
    const PAD_L = Number(chart.dataset.padl);
    const slot = Number(chart.dataset.slot);
    const n = Number(chart.dataset.n);
    let active = -1;

    const applySeriesVisibility = () => {
      chart.querySelector(".trend-bars")?.classList.toggle("series-hidden", !seriesVisibility.orders);
      chart.querySelector(".axis-orders")?.classList.toggle("series-hidden", !seriesVisibility.orders);
      chart.querySelector(".trend-line-svg")?.classList.toggle("series-hidden", !seriesVisibility.revenue);
      chart.querySelector(".axis-revenue")?.classList.toggle("series-hidden", !seriesVisibility.revenue);
      document.querySelectorAll("[data-series]").forEach((button) => {
        const visible = seriesVisibility[button.dataset.series];
        button.classList.toggle("inactive", !visible);
        button.setAttribute("aria-pressed", String(visible));
      });
      tip.style.opacity = "0";
      hline.style.opacity = "0";
    };

    document.querySelectorAll("[data-series]").forEach((button) => {
      button.addEventListener("click", () => {
        const series = button.dataset.series;
        seriesVisibility[series] = !seriesVisibility[series];
        applySeriesVisibility();
      });
    });

    const setActive = (idx) => {
      if (idx === active) return;
      active = idx;
      cols.forEach((c) => c.classList.toggle("active", Number(c.dataset.index) === idx));
      dots.forEach((d) => d.classList.toggle("active", Number(d.dataset.index) === idx));
    };

    chart.addEventListener("mousemove", (e) => {
      if (!seriesVisibility.orders && !seriesVisibility.revenue) return;
      const cr = chart.getBoundingClientRect();
      const x = e.clientX - cr.left;
      const idx = Math.max(0, Math.min(n - 1, Math.floor((x - PAD_L) / slot)));
      setActive(idx);
      const d = currentDaily[idx];
      const cx = PAD_L + slot * idx + slot / 2;
      hline.style.left = `${cx.toFixed(1)}px`;
      hline.style.opacity = "1";
      tip.innerHTML = `<div class="tip-date">${d.name.slice(5).replace("-", "/")}</div>
        ${seriesVisibility.orders ? `<div class="tip-row"><i class="sw-bar"></i>订单数<b>${integer(d.orders)}</b></div>` : ""}
        ${seriesVisibility.revenue ? `<div class="tip-row"><i class="sw-line"></i>销售额<b>${money(d.revenue)}</b></div>` : ""}`;
      const TIP_W = 132;
      tip.style.left = `${Math.min(Math.max(cx - TIP_W / 2, 2), chart.clientWidth - TIP_W - 2)}px`;
      tip.style.opacity = "1";
    });

    chart.addEventListener("mouseleave", () => {
      active = -1;
      cols.forEach((c) => c.classList.remove("active"));
      dots.forEach((d) => d.classList.remove("active"));
      tip.style.opacity = "0";
      hline.style.opacity = "0";
    });
  }

  function statusRing(statuses, anim) {
    let cursor = 0;
    const segments = statuses.map((item) => {
      const offset = cursor;
      cursor += item.share;
      return `<circle class="status-segment" data-status="${escapeHtml(item.name)}" data-orders="${item.orders}" data-share="${item.share}" cx="75" cy="75" r="56" pathLength="100" stroke="${statusColors[item.name]}" stroke-dasharray="${item.share} ${100 - item.share}" stroke-dashoffset="${-offset}" transform="rotate(-90 75 75)" tabindex="0" role="button" aria-label="${escapeHtml(item.name)} ${integer(item.orders)} 单，占比 ${percent(item.share)}"></circle>`;
    }).join("");
    const legend = statuses.map((item) => `<button type="button" data-status="${escapeHtml(item.name)}" aria-pressed="false">
      <span class="legend-dot" style="background:${statusColors[item.name]}"></span>
      <span>${escapeHtml(item.name)}</span>
    </button>`).join("");

    return `<article class="panel status-panel${animAttr(anim)}">
      <div class="panel-head"><h3>订单状态</h3></div>
      <div class="status-layout">
        <div class="donut">
          <svg viewBox="0 0 150 150" aria-label="订单状态分布">
            <circle class="donut-track" cx="75" cy="75" r="56"></circle>
            ${segments}
          </svg>
          <div class="donut-label"><span>状态分布</span></div>
        </div>
        <div class="status-legend">${legend}</div>
      </div>
    </article>`;
  }

  function bindStatusRing() {
    const panel = document.querySelector(".status-panel");
    if (!panel) return;
    const segments = panel.querySelectorAll(".status-segment");
    const buttons = panel.querySelectorAll(".status-legend [data-status]");
    const targets = [...segments, ...buttons];
    const label = panel.querySelector(".donut-label");
    const selectedStatuses = new Set();

    const applyStatus = (hoveredStatus = null) => {
      const hasHighlight = selectedStatuses.size > 0 || Boolean(hoveredStatus);
      segments.forEach((segment) => {
        const selected = selectedStatuses.has(segment.dataset.status);
        const matches = selected || segment.dataset.status === hoveredStatus;
        segment.classList.toggle("is-active", hasHighlight && matches);
        segment.classList.toggle("is-dimmed", hasHighlight && !matches);
        segment.setAttribute("aria-pressed", String(selected));
      });
      buttons.forEach((button) => {
        const selected = selectedStatuses.has(button.dataset.status);
        const matches = selected || button.dataset.status === hoveredStatus;
        button.classList.toggle("is-active", hasHighlight && matches);
        button.classList.toggle("is-dimmed", hasHighlight && !matches);
        button.setAttribute("aria-pressed", String(selected));
      });

      const hovered = [...segments].find((segment) => segment.dataset.status === hoveredStatus);
      const chosen = hovered
        ? [hovered]
        : [...segments].filter((segment) => selectedStatuses.has(segment.dataset.status));
      if (chosen.length) {
        const orders = chosen.reduce((sum, segment) => sum + Number(segment.dataset.orders), 0);
        const share = chosen.reduce((sum, segment) => sum + Number(segment.dataset.share), 0);
        const selectionText = chosen.length > 1 ? `已选 ${chosen.length} 项 · ${percent(share)}` : percent(share);
        label.innerHTML = `<strong>${integer(orders)} 单</strong><span>${selectionText}</span>`;
      } else {
        label.innerHTML = `<span>状态分布</span>`;
      }
    };

    targets.forEach((target) => {
      const name = target.dataset.status;
      target.addEventListener("mouseenter", () => {
        applyStatus(name);
      });
      target.addEventListener("mouseleave", () => {
        applyStatus(null);
      });
      target.addEventListener("click", () => {
        if (selectedStatuses.has(name)) selectedStatuses.delete(name);
        else selectedStatuses.add(name);
        applyStatus(null);
      });
      if (target.classList.contains("status-segment")) {
        target.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            target.click();
          }
        });
      }
    });
  }

  function bindSelectableGroup(container, selector) {
    if (!container) return;
    const items = [...container.querySelectorAll(selector)];
    if (!items.length) return;
    const selectedItems = new Set();

    const applySelection = (hoveredItem = null) => {
      const hasHighlight = selectedItems.size > 0 || Boolean(hoveredItem);
      items.forEach((item) => {
        const selected = selectedItems.has(item);
        const highlighted = selected || item === hoveredItem;
        item.classList.toggle("is-selected", selected);
        item.classList.toggle("is-muted", hasHighlight && !highlighted);
        item.setAttribute(item.tagName === "TR" ? "aria-selected" : "aria-pressed", String(selected));
      });
    };

    items.forEach((item) => {
      item.classList.add("selectable-item");
      item.tabIndex = 0;
      if (item.tagName !== "TR") item.setAttribute("role", "button");
      item.addEventListener("mouseenter", () => applySelection(item));
      item.addEventListener("mouseleave", () => applySelection(null));
      item.addEventListener("click", () => {
        if (selectedItems.has(item)) selectedItems.delete(item);
        else selectedItems.add(item);
        applySelection(null);
      });
      item.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          item.click();
        }
      });
    });
  }

  function bindDashboardInteractions() {
    document.querySelectorAll(".ranked-bars").forEach((group) => bindSelectableGroup(group, ".rank-row"));
    bindSelectableGroup(document.querySelector(".mix-panel"), ".mix-block, .service-grid > div, .signal-grid > div");
    bindSelectableGroup(document.querySelector(".weekday-chart"), ":scope > div");
    bindSelectableGroup(document.querySelector(".sku-panel tbody"), ":scope > tr");
  }

  function rankedBars(items, accent = "blue", metric = "revenue") {
    const maxValue = Math.max(...items.map((item) => item[metric]), 1);
    return `<div class="ranked-bars ${accent}">${items.map((item, index) => `<div class="rank-row">
      <span class="rank-index">${String(index + 1).padStart(2, "0")}</span>
      <div class="rank-main">
        <div class="rank-label"><span title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span><strong>${metric === "revenue" ? money(item.revenue) : integer(item[metric])}</strong></div>
        <div class="bar-track"><span style="width:${item[metric] / maxValue * 100}%"></span></div>
      </div>
    </div>`).join("")}</div>`;
  }

  function mixPanel(period, anim) {
    const fulfilmentTotal = period.fulfilment.reduce((sum, item) => sum + item.revenue, 0);
    const platform = period.fulfilment.find((item) => item.name === "平台仓");
    const seller = period.fulfilment.find((item) => item.name === "商家仓");
    const platformShare = fulfilmentTotal ? (platform?.revenue || 0) / fulfilmentTotal * 100 : 0;
    const serviceTotal = period.service.reduce((sum, item) => sum + item.orders, 0);
    const services = period.service.map((item) => `<div><span>${escapeHtml(item.name)}</span><strong>${serviceTotal ? percent(item.orders / serviceTotal * 100) : "0%"}</strong><small>${integer(item.orders)} 单</small></div>`).join("");

    return `<article class="panel mix-panel${animAttr(anim)}">
      <div class="panel-head"><h3>履约、时效与客群</h3></div>
      <div class="mix-block">
        <div class="mix-title"><span>履约方</span><strong>平台仓 ${percent(platformShare)}</strong></div>
        <div class="stacked-bar"><span style="width:${platformShare}%"></span><i></i></div>
        <div class="mix-detail"><span>平台仓取消 ${percent(platform?.cancelRate || 0)}</span><span>商家仓取消 ${percent(seller?.cancelRate || 0)}</span></div>
      </div>
      <div class="service-grid">${services}</div>
      <div class="signal-grid">
        <div><span>促销订单</span><strong>${percent(period.kpis.promoRate)}</strong></div>
        <div><span>B2B 订单</span><strong>${percent(period.kpis.b2bRate)}</strong></div>
      </div>
      <div class="panel-unit">单位：% / 单</div>
    </article>`;
  }

  function weekdayPanel(weekdays, anim) {
    const maxRevenue = Math.max(...weekdays.map((item) => item.revenue), 1);
    const columns = weekdays.map((item) => `<div title="${escapeHtml(item.name)} ${escapeHtml(money(item.revenue))}">
      <div class="weekday-value">${money(item.revenue)}</div>
      <div class="weekday-track"><span style="height:${Math.max(8, item.revenue / maxRevenue * 100)}%"></span></div>
      <strong>${item.name.replace("周", "")}</strong>
    </div>`).join("");
    return `<article class="panel weekday-panel${animAttr(anim)}">
      <div class="panel-head"><h3>星期销售分布</h3></div>
      <div class="weekday-chart">${columns}</div>
      <div class="panel-unit">单位：¥</div>
    </article>`;
  }

  function skuTable(items) {
    return `<div class="table-wrap"><table><thead><tr><th>#</th><th>SKU</th><th>品类</th><th>销售额</th><th>件数</th><th>成交率</th><th>取消率</th></tr></thead><tbody>${items.map((item, index) => `<tr>
      <td>${String(index + 1).padStart(2, "0")}</td><td><strong title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</strong></td>
      <td>${escapeHtml(item.category || "未分类")}</td><td>${money(item.revenue)}</td><td>${integer(item.units)}</td><td><span class="table-success">${percent(100 - item.cancelRate)}</span></td><td><span class="${item.cancelRate >= 15 ? "table-risk" : ""}">${percent(item.cancelRate)}</span></td>
    </tr>`).join("")}</tbody></table></div>`;
  }

  function getAIComponent(id) {
    return AI_COMPONENTS.find((item) => item.id === id) || AI_COMPONENTS[0];
  }

  function addAIMessage(role, text) {
    const messages = document.getElementById("ai-messages");
    const row = document.createElement("div");
    row.className = `ai-message ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "ai-message-bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function resetAIConversation() {
    clearTimeout(aiReplyTimer);
    aiSending = false;
    document.getElementById("ai-messages").innerHTML = "";
    const selectedComponents = [...selectedAIComponentIds].map(getAIComponent);
    const period = DATA.periods[periodKey];
    if (!selectedComponents.length) {
      addAIMessage("assistant", "当前未选择分析组件。\n请点击任意组件右上角的莫比乌斯环，或使用“全选组件”。");
      const input = document.getElementById("ai-input");
      input.value = "";
      document.getElementById("ai-send").disabled = true;
      return;
    }
    const selectionLabel = selectedComponents.map((item) => `「${item.title}」`).join("、");
    addAIMessage("assistant", `已选择 ${selectedComponents.length} 个组件：${selectionLabel}。\n当前数据范围：${period.label}。\n可继续点击组件右上角的莫比乌斯环进行多选。`);
    const input = document.getElementById("ai-input");
    input.value = "";
    document.getElementById("ai-send").disabled = true;
  }

  function updateAIContext() {
    const selectedComponents = [...selectedAIComponentIds].map(getAIComponent);
    const period = DATA.periods[periodKey];
    document.getElementById("ai-sidebar-subtitle").textContent = !selectedComponents.length
      ? "请选择分析组件"
      : selectedComponents.length === 1
        ? selectedComponents[0].title
        : `已选 ${selectedComponents.length} 个组件`;
    document.getElementById("ai-period-badge").textContent = period.label;
    const selectAllButton = document.getElementById("ai-select-all");
    const allSelected = selectedAIComponentIds.size === AI_COMPONENTS.length;
    selectAllButton.disabled = false;
    selectAllButton.textContent = allSelected ? "取消全选" : "全选组件";
    const input = document.getElementById("ai-input");
    document.getElementById("ai-send").disabled = !selectedComponents.length || !input.value.trim() || aiSending;
    document.querySelectorAll(".ai-component").forEach((element) => {
      const selected = selectedAIComponentIds.has(element.dataset.aiComponent);
      element.classList.toggle("ai-component-selected", aiSidebarOpen && selected);
      element.querySelector(".ai-analyze-btn")?.setAttribute("aria-pressed", String(selected));
    });
  }

  function setupAIComponents() {
    AI_COMPONENTS.forEach((component) => {
      const element = document.querySelector(component.selector);
      if (!element) return;
      element.classList.add("ai-component");
      element.dataset.aiComponent = component.id;
      element.classList.toggle("ai-component-selected", aiSidebarOpen && selectedAIComponentIds.has(component.id));
      if (element.querySelector(".ai-analyze-btn")) return;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "ai-analyze-btn";
      button.setAttribute("aria-label", `智能分析：${component.title}`);
      button.setAttribute("aria-pressed", String(selectedAIComponentIds.has(component.id)));
      button.title = `智能分析：${component.title}`;
      button.innerHTML = AI_MOBIUS_ICON;
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleAIComponent(component.id);
      });
      const head = element.querySelector(":scope > .panel-head");
      if (head) head.appendChild(button);
      else element.appendChild(button);
    });
  }

  function refitTrendRow() {
    const period = DATA.periods[periodKey];
    const trendRow = document.querySelector(".content-grid.trend-layout");
    const tScr = document.querySelector(".trend-scroll");
    if (!trendRow || !tScr) return;
    const fitted = Math.max(320, Math.floor(tScr.clientWidth - 2));
    trendRow.innerHTML = trendChart(period.daily, null, fitted) + statusRing(period.statuses, null);
    bindTrendChart();
    bindStatusRing();
    setupAIComponents();
  }

  function scheduleAIChartFit() {
    clearTimeout(aiLayoutTimer);
    aiLayoutTimer = setTimeout(refitTrendRow, 310);
  }

  function openAISidebar(componentId) {
    if (componentId && !selectedAIComponentIds.size) selectedAIComponentIds.add(componentId);
    if (componentId) currentAIComponentId = componentId;
    aiSidebarOpen = true;
    document.querySelector(".app-shell").classList.add("ai-open");
    const sidebar = document.getElementById("ai-sidebar");
    sidebar.setAttribute("aria-hidden", "false");
    sidebar.inert = false;
    updateAIContext();
    if (!document.getElementById("ai-messages").children.length) resetAIConversation();
    scheduleAIChartFit();
    setTimeout(() => document.getElementById("ai-input").focus(), 80);
  }

  function toggleAIComponent(componentId) {
    if (!aiSidebarOpen) {
      selectedAIComponentIds.clear();
      selectedAIComponentIds.add(componentId);
      currentAIComponentId = componentId;
      openAISidebar(componentId);
      resetAIConversation();
      return;
    }

    if (selectedAIComponentIds.has(componentId)) {
      selectedAIComponentIds.delete(componentId);
      if (currentAIComponentId === componentId && selectedAIComponentIds.size) currentAIComponentId = [...selectedAIComponentIds].at(-1);
    } else {
      selectedAIComponentIds.add(componentId);
      currentAIComponentId = componentId;
    }
    updateAIContext();
    resetAIConversation();
  }

  function selectAllAIComponents() {
    if (selectedAIComponentIds.size === AI_COMPONENTS.length) {
      selectedAIComponentIds.clear();
    } else {
      AI_COMPONENTS.forEach((component) => selectedAIComponentIds.add(component.id));
      currentAIComponentId = AI_COMPONENTS.at(-1).id;
    }
    updateAIContext();
    resetAIConversation();
  }

  function closeAISidebar() {
    aiSidebarOpen = false;
    document.querySelector(".app-shell").classList.remove("ai-open");
    const sidebar = document.getElementById("ai-sidebar");
    sidebar.setAttribute("aria-hidden", "true");
    sidebar.inert = true;
    updateAIContext();
    scheduleAIChartFit();
  }

  function rankingInsight(items, noun) {
    const top = items[0];
    const total = items.reduce((sum, item) => sum + item.revenue, 0);
    const top3 = items.slice(0, 3).reduce((sum, item) => sum + item.revenue, 0);
    return `${noun}第一为「${top.name}」，销售额 ${money(top.revenue)}。前 3 名占当前榜单销售额的 ${percent(total ? top3 / total * 100 : 0)}。`;
  }

  function generateDemoAIReply(componentId, key, question) {
    const period = DATA.periods[key];
    const component = getAIComponent(componentId);
    let conclusion = "";
    let observation = "";
    let suggestion = "";

    if (componentId === "kpi-revenue") {
      conclusion = `有效销售额为 ${money(period.kpis.revenue, 2)}，日均 ${money(period.kpis.dailyRevenue)}。`;
      observation = `当前取消率 ${percent(period.kpis.cancelRate)}，销售额覆盖率 ${percent(period.kpis.amountCoverage)}。`;
      suggestion = "优先排查高销售额但取消率偏高的 SKU，减少无效流失。";
    } else if (componentId === "kpi-orders") {
      conclusion = `订单数为 ${integer(period.kpis.orders)} 单，有效订单 ${integer(period.kpis.validOrders)} 单。`;
      observation = `取消率 ${percent(period.kpis.cancelRate)}，有效单送达率 ${percent(period.kpis.deliveredRate)}。`;
      suggestion = "建议按履约方和地区继续拆分取消订单，定位主要损耗环节。";
    } else if (componentId === "kpi-units") {
      conclusion = `销售件数为 ${integer(period.kpis.units)} 件，平均每个有效订单约 ${(period.kpis.units / Math.max(period.kpis.validOrders, 1)).toFixed(2)} 件。`;
      observation = `促销订单占比 ${percent(period.kpis.promoRate)}。`;
      suggestion = "可针对高销量品类设计组合购和加价购，提升连带件数。";
    } else if (componentId === "kpi-aov") {
      conclusion = `有效客单价为 ${money(period.kpis.aov)}，平均件单价 ${money(period.kpis.itemPrice)}。`;
      observation = `B2B 订单占比 ${percent(period.kpis.b2bRate)}，促销订单占比 ${percent(period.kpis.promoRate)}。`;
      suggestion = "建议区分促销与非促销客群监控客单价，避免促销对单价造成过度稀释。";
    } else if (componentId === "daily-trend") {
      const peakRevenue = period.daily.reduce((a, b) => a.revenue > b.revenue ? a : b);
      const peakOrders = period.daily.reduce((a, b) => a.orders > b.orders ? a : b);
      conclusion = `销售额峰值出现在 ${peakRevenue.name}，为 ${money(peakRevenue.revenue)}；订单峰值为 ${peakOrders.name} 的 ${integer(peakOrders.orders)} 单。`;
      observation = `日均销售额 ${money(period.kpis.dailyRevenue)}，日度最高取消率为 ${percent(Math.max(...period.daily.map((item) => item.cancelRate)))}。`;
      suggestion = "建议将峰值日与促销、库存和履约数据联动复盘，同时监控峰值后的取消波动。";
    } else if (componentId === "order-status") {
      const largest = period.statuses.reduce((a, b) => a.orders > b.orders ? a : b);
      conclusion = `占比最高的状态是「${largest.name}」，共 ${integer(largest.orders)} 单，占 ${percent(largest.share)}。`;
      observation = period.statuses.map((item) => `${item.name} ${percent(item.share)}`).join("；") + "。";
      suggestion = "建议优先跟踪取消和退货/退回状态，并按品类、地区进一步拆分。";
    } else if (componentId === "categories") {
      conclusion = rankingInsight(period.categories, "品类");
      observation = `头部品类取消率为 ${percent(period.categories[0].cancelRate)}。`;
      suggestion = "将流量和库存优先配置给头部品类，同时对高取消品类做商品页与库存校验。";
    } else if (componentId === "regions") {
      conclusion = rankingInsight(period.states.slice(0, 6), "区域");
      observation = `头部区域取消率为 ${percent(period.states[0].cancelRate)}。`;
      suggestion = "建议比较头部区域的履约方式和时效，将取消率纳入区域质量评估。";
    } else if (componentId === "cities") {
      conclusion = rankingInsight(period.cities, "城市");
      observation = `头部城市取消率为 ${percent(period.cities[0].cancelRate)}。`;
      suggestion = "可围绕头部城市建立分层运营策略，并对高销售、高取消城市单独治理。";
    } else if (componentId === "fulfilment") {
      const total = period.fulfilment.reduce((sum, item) => sum + item.revenue, 0);
      const platform = period.fulfilment.find((item) => item.name === "平台仓");
      conclusion = `平台仓销售额占履约销售额的 ${percent(total ? (platform?.revenue || 0) / total * 100 : 0)}。`;
      observation = period.service.map((item) => `${item.name} ${integer(item.orders)} 单`).join("；") + "。";
      suggestion = "建议联合对比平台仓与商家仓的取消率和送达率，优化高风险履约链路。";
    } else if (componentId === "weekdays") {
      const best = period.weekdays.reduce((a, b) => a.revenue > b.revenue ? a : b);
      const weakest = period.weekdays.reduce((a, b) => a.revenue < b.revenue ? a : b);
      conclusion = `${best.name}销售额最高，为 ${money(best.revenue)}；${weakest.name}最低，为 ${money(weakest.revenue)}。`;
      observation = `最高日比最低日高 ${percent(weakest.revenue ? (best.revenue / weakest.revenue - 1) * 100 : 0)}。`;
      suggestion = "建议将营销预算和库存补充向高转化星期倾斜，弱势日尝试定向促销。";
    } else if (componentId === "skus") {
      const top = period.skus[0];
      const risky = period.skus.filter((item) => item.cancelRate >= 15).length;
      conclusion = `Top 1 SKU 为 ${top.name}（${top.category || "未分类"}），销售额 ${money(top.revenue)}，成交率 ${percent(100 - top.cancelRate)}。`;
      observation = `Top 100 中有 ${risky} 个 SKU 取消率达到 15% 或以上。`;
      suggestion = "建议优先复盘高销售额且高取消的 SKU，检查尺码、库存和商品描述。";
    }

    if (question.includes("对比") || question.includes("其他月")) {
      const monthRows = ["2022-04", "2022-05", "2022-06"].map((monthKey) => {
        const item = DATA.periods[monthKey];
        return `${item.label} ${money(item.kpis.revenue)}`;
      });
      observation += `\n月度有效销售额对比：${monthRows.join("；")}。`;
    }

    return `基于「${period.label} · ${component.title}」的本地数据：\n\n核心结论\n${conclusion}\n\n数据观察\n${observation}\n\n经营建议\n${suggestion}\n\n注：这是前端 Demo 的规则化分析，未调用后端 AI。`;
  }

  function generateMultiDemoAIReply(componentIds, key, question) {
    if (componentIds.length === 1) return generateDemoAIReply(componentIds[0], key, question);
    const period = DATA.periods[key];
    const summaries = componentIds.map((componentId) => {
      const component = getAIComponent(componentId);
      const fullReply = generateDemoAIReply(componentId, key, question);
      const conclusion = fullReply.match(/核心结论\n([\s\S]*?)\n\n数据观察/)?.[1] || fullReply;
      return `【${component.title}】\n${conclusion}`;
    });
    const comparison = question.includes("对比")
      ? `\n\n月度销售额对比\n${["2022-04", "2022-05", "2022-06"].map((monthKey) => `${DATA.periods[monthKey].label} ${money(DATA.periods[monthKey].kpis.revenue)}`).join("；")}`
      : "";
    return `已联合分析「${period.label}」的 ${componentIds.length} 个组件：\n\n${summaries.join("\n\n")}${comparison}\n\n综合建议\n建议将上述指标联动观察，优先处理“高贡献且高取消”的交叉问题，并按月份跟踪改善效果。\n\n注：这是前端 Demo 的规则化分析，未调用后端 AI。`;
  }

  function sendAIQuestion(question) {
    const text = String(question || "").trim();
    if (!text || aiSending) return;
    if (!selectedAIComponentIds.size) {
      addAIMessage("notice", "请先选择至少一个分析组件");
      return;
    }
    aiSending = true;
    const capturedComponents = [...selectedAIComponentIds];
    const capturedPeriod = periodKey;
    addAIMessage("user", text);
    const typingRow = addAIMessage("assistant", "");
    typingRow.querySelector(".ai-message-bubble").innerHTML = '<span class="ai-typing" aria-label="正在分析"><i></i><i></i><i></i></span>';
    const input = document.getElementById("ai-input");
    input.value = "";
    document.getElementById("ai-send").disabled = true;

    clearTimeout(aiReplyTimer);
    aiReplyTimer = setTimeout(() => {
      typingRow.remove();
      addAIMessage("assistant", generateMultiDemoAIReply(capturedComponents, capturedPeriod, text));
      aiSending = false;
      document.getElementById("ai-send").disabled = !document.getElementById("ai-input").value.trim();
    }, 720);
  }

  function initResourceSidebar() {
    const sidebar = document.getElementById("resource-sidebar");
    const toggle = document.getElementById("resource-toggle");
    const customList = document.getElementById("resource-custom-list");
    let folderCount = 0;

    const setExpanded = (expanded) => {
      sidebar.classList.toggle("expanded", expanded);
      toggle.setAttribute("aria-expanded", String(expanded));
      toggle.setAttribute("aria-label", expanded ? "收回资源侧边栏" : "展开资源侧边栏");
      toggle.title = expanded ? "收回资源侧边栏" : "展开资源侧边栏";
      clearTimeout(aiLayoutTimer);
      aiLayoutTimer = setTimeout(refitTrendRow, 270);
    };

    const activateItem = (item) => {
      sidebar.querySelectorAll(".resource-item").forEach((button) => button.classList.toggle("active", button === item));
    };

    toggle.addEventListener("click", () => setExpanded(!sidebar.classList.contains("expanded")));
    sidebar.querySelectorAll(".resource-item").forEach((item) => {
      item.addEventListener("click", () => activateItem(item));
    });
    document.getElementById("resource-new-folder").addEventListener("click", () => {
      folderCount += 1;
      if (!sidebar.classList.contains("expanded")) setExpanded(true);
      const folder = document.createElement("button");
      folder.type = "button";
      folder.className = "resource-item";
      folder.title = `新建文件夹 ${folderCount}`;
      const icon = document.createElement("span");
      icon.className = "resource-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = "▣";
      const label = document.createElement("span");
      label.className = "resource-label";
      label.textContent = `新建文件夹 ${folderCount}`;
      folder.append(icon, label);
      folder.addEventListener("click", () => activateItem(folder));
      customList.appendChild(folder);
      activateItem(folder);
    });
  }

  function initAIDemo() {
    document.getElementById("ai-close").addEventListener("click", closeAISidebar);
    document.getElementById("ai-overlay").addEventListener("click", closeAISidebar);
    document.getElementById("ai-floating-trigger").addEventListener("click", () => openAISidebar(currentAIComponentId));
    document.getElementById("ai-select-all").addEventListener("click", selectAllAIComponents);
    document.getElementById("ai-clear").addEventListener("click", resetAIConversation);
    document.querySelectorAll("[data-ai-prompt]").forEach((button) => {
      button.addEventListener("click", () => sendAIQuestion(button.dataset.aiPrompt));
    });
    const input = document.getElementById("ai-input");
    const send = document.getElementById("ai-send");
    input.addEventListener("input", () => { send.disabled = !selectedAIComponentIds.size || !input.value.trim() || aiSending; });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendAIQuestion(input.value);
      }
    });
    document.getElementById("ai-composer").addEventListener("submit", (event) => {
      event.preventDefault();
      sendAIQuestion(input.value);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && aiSidebarOpen) closeAISidebar();
    });
  }

        ${kpiCard({ label: "销售件数", value: integer(period.kpis.units), unit: "件", anim: A(0.20) })}
        ${kpiCard({ label: "有效客单价", value: money(period.kpis.aov), unit: "¥/单", anim: A(0.26) })}
      </section>

      </section>
      <section class="content-grid single">
        <article class="panel category-panel${animAttr(A(0.48))}"><div class="panel-head"><h3>品类销售 TOP 8</h3></div>${rankedBars(period.categories, "lime")}<div class="panel-unit">单位：¥</div></article>
      </section>
      <section class="content-grid three-col">
        <article class="panel geo-panel${animAttr(A(0.56))}"><div class="panel-head"><h3>区域销售 TOP 6</h3></div>${rankedBars(period.states.slice(0, 6))}<div class="panel-unit">单位：¥</div></article>
        ${mixPanel(period, A(0.62))}
        ${weekdayPanel(period.weekdays, A(0.68))}
      </section>
      <section class="content-grid single">
        <article class="panel city-panel${animAttr(A(0.76))}"><div class="panel-head"><h3>城市销售贡献</h3></div>${rankedBars(period.cities, "violet")}<div class="panel-unit">单位：¥</div></article>
      </section>
      <section class="content-grid single">
        <article class="panel sku-panel${animAttr(A(0.84))}"><div class="panel-head"><h3>SKU 经营明细 TOP 100</h3></div>${skuTable(period.skus)}<div class="panel-unit">单位：¥ / 件</div></article>
      </section>
      <footer${playIntro ? ' class="anim" style="animation-delay:0.90s"' : ""}><div><strong>DATA SCOPE</strong><span>${escapeHtml(DATA.meta.source)} · ${integer(DATA.meta.rowCount)} 条明细 · ${DATA.meta.startDate} 至 ${DATA.meta.endDate}</span></div><details><summary>口径说明</summary><div>${DATA.meta.notes.map((note) => `<p>${escapeHtml(note)}</p>`).join("")}</div></details></footer>
    `;

    // 按面板实际宽度重绘：月度数据铺满空间，全周期数据也不产生横向滚动
    const tScr = document.querySelector(".trend-scroll");
    const tCh = document.querySelector(".trend-chart");
    if (tScr && tCh) {
      const fitted = Math.max(320, Math.floor(tScr.clientWidth - 2));
      const needsFit = Math.abs(tCh.offsetWidth - fitted) > 2;
      const trendRow = document.querySelector(".content-grid.trend-layout");
      if (needsFit && trendRow) {
        trendRow.innerHTML = trendChart(period.daily, A(0.34), fitted) +
          statusRing(period.statuses, A(0.40));
      }
    }

    document.querySelectorAll("[data-period]").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.period === periodKey) return;
        periodKey = button.dataset.period;
        render();
      });
    });

    bindTrendChart();
    bindStatusRing();
    bindDashboardInteractions();
    setupAIComponents();
    if (aiSidebarOpen) {
      updateAIContext();
      if (!playIntro) addAIMessage("notice", `数据范围已切换为「${period.label}」`);
    }

    // 快速连续切换时取消上一轮动画清理
    clearTimeout(animationCleanupTimer);
    clearTimeout(refreshCleanupTimer);
    if (playIntro) {
      animationCleanupTimer = setTimeout(() => {
        document.querySelectorAll(".anim").forEach((el) => el.classList.remove("anim"));
      }, 1650);
    } else {
      // 重置后只让数值、图表和表格淡入，面板本身保持不动
      void dashboard.offsetWidth;
      dashboard.classList.add("data-refresh");
      refreshCleanupTimer = setTimeout(() => dashboard.classList.remove("data-refresh"), 450);
    }
    isInitialRender = false;
  }

  initResourceSidebar();
  initAIDemo();
  render();
})();
</script>
</body>
</html>
